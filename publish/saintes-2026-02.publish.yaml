event: saintes-2026-02
title: Saintes flood, February 2026
start: 2026-02-15        # the flood itself; set the real dates
end: 2026-02-19
compare: [s1-before, s1-after]
layers:
  - slug: s1-before
    file: ../outputs/saintes-2026-02/s1-before.tif
    role: imagery
    kind: raster
    title: Sentinel-1 before
    shown: false
    acquired: 25-01-2026
    rgb: {bands: [1, 2, 3], ranges: [[-20, -3], [-26, -9], [2, 12]]}
  - slug: s1-after
    file: ../outputs/saintes-2026-02/s1-after.tif
    role: imagery
    kind: raster
    title: Sentinel-1 after
    shown: false
    acquired: 23-02-2026
    rgb: {bands: [1, 2, 3], ranges: [[-20, -3], [-26, -9], [2, 12]]}
  - slug: flood-extent
    file: ../outputs/saintes-2026-02/flood-extent.tif
    role: result
    kind: raster
    title: Flood extent
    shown: true
    categories:
      - {value: 0, color: "#000000", label: No flood, transparent: true}
      - {value: 1, color: "#1f78b4", label: Flooded}