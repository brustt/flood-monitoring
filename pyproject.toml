[project]
name = "flood-monitoring"
version = "0.1.0"
description = "Maps the extent of a flood from a Sentinel-1 time series and prepares it for the brustt.xyz Platform"
readme = "README.md"
authors = [
    { name = "brustt", email = "martin.dzr@protonmail.com" }
]
requires-python = ">=3.12"
# The light install: wheels only, enough for the load stage (#43), e.g. on the VPS with
# `uv sync --frozen --no-dev --no-group full`. The other stages need the `full` group below.
dependencies = [
    "dask>=2026.8.0",
    "geopandas",
    "netcdf4>=1.7.4",
    "numpy>=2.5.4",
    "odc-stac>=0.5.3",
    "planetary-computer>=1.0.0",
    "psutil>=7.2.2",
    "pyproj>=3.8.0",
    "pystac>=1.15.2",
    "pystac-client>=0.9.0",
    "pyyaml>=6.0",
    "rasterio>=1.5.2",
    "rioxarray>=0.23.0",
    "shapely",
    "stac-geoparquet>=0.9.0",
    "xarray>=2026.9.0",
]

[project.scripts]
flood-monitoring = "flood_monitoring.cli:main"

[dependency-groups]
# Every stage but load: eo-pipe (stack, despeckle, the sieve; it builds the GDAL bindings against the system GDAL),
# eo-stac (download), platform-publish (export). Installed by default (see default-groups).
full = [
    "eo-pipe",
    "eo-stac",
    "platform-publish",
]
dev = [
    "pytest>=8.0",
]
notebook = [
    "folium>=0.20.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pillow>=12.3.0",
]

# eo-pipe pins the gdal Python bindings, which compile against the system
# GDAL C library found through gdal-config on PATH. numpy must be present at
# build time or the bindings are built without gdal_array.
[tool.uv]
default-groups = ["full", "dev"]

[tool.uv.extra-build-dependencies]
gdal = ["setuptools", "numpy"]

# GDAL 3.12.2 lives in /usr/local, next to the distribution's older libgdal.
# The system Python puts /usr/lib/x86_64-linux-gnu first on the link line, so
# without this the bindings link against the wrong library and fail to import.
[tool.uv.extra-build-variables]
gdal = { LDFLAGS = "-L/usr/local/lib -Wl,-rpath,/usr/local/lib" }

[tool.uv.sources]
eo-pipe = { path = "../eo-pipe", editable = true }
eo-stac = { git = "https://github.com/brustt/eo-stac", branch = "main" }
platform-publish = { git = "https://github.com/brustt/platform-publish", tag = "v0.2.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
